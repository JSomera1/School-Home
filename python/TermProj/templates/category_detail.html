{% extends "base.html" %}

{% block content %}
<h1> {{ data.name }}</h1>
<div class="d-flex flex-wrap">
    {% for element in data %}
    <div class="orders">
        <h1> {{ element.name }}</h1>
        <p> Price: {{ element.price }}</p>
        <p> Stock: {{ element.inventory }}</p>
    </div>
    {% endfor %}
</div>
{% endblock %}
