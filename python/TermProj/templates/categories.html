{% extends "base.html" %}

{% block content %}
<h1>categories</h1>
<div class="d-flex flex-wrap">
    {% for category in data %}
    <div class="m-2 p-3 border border-black text-center">
        <a href="{{ url_for('html.category_detail', name=category.name ) }}"> {{ category.name }}</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
